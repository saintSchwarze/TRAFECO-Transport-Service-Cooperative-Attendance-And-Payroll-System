# Replace certificate paths before use.
# Keep the first virtual host as the default so unknown Host headers are denied.
# Before a certificate exists, install only the two *:80 blocks below. Obtain the
# certificate, then install the two *:443 blocks and disable the stock
# <VirtualHost _default_:443> block in conf/extra/httpd-ssl.conf.

<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName default.invalid
    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/certs/trafeco.duckdns.org-chain.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/certs/trafeco.duckdns.org-key.pem"
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName trafeco.duckdns.org
    DocumentRoot "C:/xampp/htdocs/capstoneee"

    <Directory "C:/xampp/htdocs/capstoneee">
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    # Permit ACME HTTP-01 certificate checks; redirect all other requests.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://trafeco.duckdns.org%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName trafeco.duckdns.org
    DocumentRoot "C:/xampp/htdocs/capstoneee"

    <Directory "C:/xampp/htdocs/capstoneee">
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/certs/trafeco.duckdns.org-chain.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/certs/trafeco.duckdns.org-key.pem"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
